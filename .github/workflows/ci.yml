name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: npm test
      - run: npm run check
  seed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./
        id: setup
        with:
          cache-key-suffix: ci-${{ github.run_id }}-${{ github.run_attempt }}
          toolchain-java-home: 'true'
      - name: Run script twice and verify the compilation cache
        shell: bash
        run: node test/smoke.mjs
      - name: Verify Toolchain Java export
        shell: bash
        run: test "$KOTLIN_CLI_JAVA_HOME" = "$JAVA_HOME"
  restore:
    needs: seed
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./
        id: setup
        with:
          cache-key-suffix: ci-${{ github.run_id }}-${{ github.run_attempt }}
          cache-read-only: 'true'
      - name: Require all three caches from the previous job
        shell: bash
        env:
          COMPILER_HIT: ${{ steps.setup.outputs.compiler-cache-hit }}
          DEPS_HIT: ${{ steps.setup.outputs.dependencies-cache-hit }}
          COMPILED_HIT: ${{ steps.setup.outputs.compiled-cache-hit }}
        run: |
          test "$COMPILER_HIT" = true
          test "$DEPS_HIT" = true
          test "$COMPILED_HIT" = true
          node test/smoke.mjs restored
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./
        with:
          kotlin-version: '2.2.20'
          java-version: '21'
          cache: 'false'
      - run: node test/smoke.mjs
